<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Converter</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container mainBox">
      <div class="converterBox">
        <h1 class="text-center mb-4">Currency Converter</h1>
        <!-- Amount -->
        <div class="mb-3">
          <label class="form-label">Enter Amount</label>
          <input
            type="number"
            id="orgAmount"
            class="form-control"
            placeholder="Enter Amount"
          />
        </div>
        <!-- Country Section -->
        <div class="row align-items-center">
          <!-- From Country -->
          <div class="col-md-5 mb-3">
            <label class="form-label">From</label>
            <div class="flagBox"><img src="" alt="flag" id="flag1" /></div>
            <select id="country1" class="form-select" onchange="updateFlag1()">
              <option value="">Select Country</option>
            </select>
          </div>
          <!-- Swap Button -->
          <div class="col-md-2 text-center mb-3">
            <button class="btn btn-dark swapBtn" onclick="swapCountry()">
              <i class="bi bi-arrow-left-right"></i>
            </button>
          </div>
          <!-- To Country -->
          <div class="col-md-5 mb-3">
            <label class="form-label">To</label>
            <div class="flagBox"><img src="" alt="flag" id="flag2" /></div>
            <select id="country2" class="form-select" onchange="updateFlag2()">
              <option value="">Select Country</option>
            </select>
          </div>
        </div>
        <!-- Error -->
        <p id="errorMsg"></p>
        <!-- Convert Button -->
        <button
          class="btn btn-primary w-100 mt-3"
          id="convertBtn"
          onclick="convertCurrency()"
        >
          Convert
        </button>
        <!-- Result -->
        <div class="resultBox mt-4">
          <h3 id="newAmount">Result Here</h3>
          <p id="rateText"></p>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
