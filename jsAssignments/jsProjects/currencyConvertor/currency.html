<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="currency.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <section class="outerdiv">
         <header class="p-2">
            <h2 class="text-center"><i class="bi bi-currency-exchange mx-3"></i>Currency Convertor</h2>
            <p class="text-center opacity-75">Convert amounts between world currencies in real time</p>
        </header>
      <div class="Container shadow p-3 w-50 h-75">
        <!-- div1 -->
       <div class="div1 border ">
        <div class="flagdiv1 d-flex flex-column gap-3 p-2">
        <p class="fw-bolder">From</p>
        <img src="https://cdn.britannica.com/97/1597-050-008F30FA/Flag-India.jpg" class="flag" id="fromFlag" alt="">
        <select name="" id="fromCurrency" class="form-control ">
            <!-- <option value="usd">Usd</option>
            <option value="inr">Inr</option> -->
        </select>
       </div>
       <div class="flagdiv2 d-flex flex-column gap-3 p-2">
        <p class="fw-bolder">To</p>
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/96/Flag_of_the_United_States_%28DDD-F-416E_specifications%29.svg/1280px-Flag_of_the_United_States_%28DDD-F-416E_specifications%29.svg.png" class="flag" id="toFlag" alt="">
        <select name="" id="toCurrency" class="form-control">
            <!-- <option value="usd">Usd</option>
            <option value="inr">Inr</option> -->
        </select>
       </div>
       </div>
        <!-- div2 -->
         <div class="div2 border d-flex justify-content-between gap-3 p-2">
            <div class="d-flex flex-column w-75">
                <p class="mb-2">Enter Amount</p>
                <input type="number" id="amount" class="form-control">
            </div>
            <div class="w-25 d-flex justify-content-end align-items-end">
                <button class="btn btn-primary w-100" id="convertBtn"><i class="bi bi-arrow-clockwise fs-5"></i>Convert</button>
            </div>
         </div>
          <!-- div3 -->
         <div class="conversionrate border h-25 d-flex justify-content-center align-items-center">
            <h2>Converted Amount : <span id="realAmount">2500</span></h2>
         </div>

      </div>
    </section>

    <!-- bootstrap link -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="currency.js"></script>
  </body>
</html>
