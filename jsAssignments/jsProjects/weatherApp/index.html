<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="Container">
      <div class="innerdiv border shadow">
        <h3 class="text-center">Weather App</h3>
        <!-- searchbox -->
        <div class="searchbox p-3">
          <input
            type="text"
            placeholder="enter cityname"
            class="form-control"
            id="city"
          />
          <button type="button" id="btn"><i class="bi bi-search"></i></button>
        </div>
        <!-- weatherbox -->
        <div class="weather">
          <div class="text-center mt-3">
            <i class="bi bi-thermometer-sun fs-1"></i>
            <h2 class="temp">20°C</h2>
            <h2 class="cityname">New York</h2>
          </div>
          <div class="moreDetails d-flex justify-content-around  mt-4">
            <div class="col1">
              <i class="bi bi-moisture fs-1"></i>
              <h5 class="humidity">50%</h5>
              <p>Humidity</p>
            </div>
            <div class="col1">
              <i class="bi bi-fan fs-1"></i>
              <h5 class="windspeed">15km/h</h5>
              <p>Wind Speed</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- bootstrap link -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
