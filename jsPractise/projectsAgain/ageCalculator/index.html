<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body class="d-flex justify-content-center align-items-center vh-100">
    <div class="container border w-25 p-3 mt-4 rounded">
      <h1 class="text-center">Age Calculator</h1>
      <p class="fw-bold text-center mb-3">Enter your date of birth</p>
      <input type="date" class="form-control" id="dobYear"/>
      <p class="fw-bold text-center mb-3">Current Date</p>
      <input type="date" class="form-control" id="currentYear"/>
      <div class="d-flex justify-content-center">
        <button class="btn btn-primary mx-auto mt-3">Calculate</button>
      </div>
      <p class="text-center fw-bold mt-2">
        Your Age is <span id="ageDisplay">12</span> Years
      </p>
    </div>

    <!-- bootstrap link -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
