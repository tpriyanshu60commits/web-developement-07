<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <header
      class="bg-primary text-white display-6 p-2 text-center rounded-bottom"
    >
      <h1>Registration Form</h1>
    </header>

    <form class="registrationForm">
      <div class="container border border- mt-3 rounded">
        <!-- Personal Information: -->
        <div class="p-4 mt-4 mb-5 shadow d-flex flex-column gap-3 rounded-3">
          <div>
            <label for="fullName" class="fw-bolder mb-2">Full Name:</label>
            <input
              type="text"
              id="fullName"
              class="form-control"
              placeholder="Raj Vardhan"
            />
            <span
              class="manualError small text-danger"
              id="fullNameError"
            ></span>
          </div>
          <div>
            <label for="email" class="fw-bolder mb-2">Email:</label>
            <input
              type="email"
              id="email"
              class="form-control"
              placeholder="rajvardhan@example.com"
            />
            <span class="manualError small text-danger" id="emailError"></span>
          </div>
          <div>
            <label for="mobileNumber" class="fw-bolder mb-2"
              >Mobile Number:</label
            >
            <input
              type="number"
              id="mobileNumber"
              class="form-control"
              placeholder="9876543210"
            />
            <span
              class="manualError small text-danger"
              id="mobileNumberError"
            ></span>
          </div>
          <div>
            <label for="dateofBirth" class="fw-bolder mb-2"
              >Date of Birth:</label
            >
            <input
              type="date"
              id="dateofBirth"
              class="form-control"
              placeholder="2008-04-15"
            />
            <span
              class="manualError small text-danger"
              id="dateofBirthError"
            ></span>
          </div>
          <div>
            <label for="gender" class="fw-bolder mb-2">Gender:</label>
            <div class="d-flex gap-2">
              <input type="radio" name="gender" value="male" />Male
              <input type="radio" name="gender" value="female" />female
              <input type="radio" name="gender" value="other" />other
            </div>
            <span class="manualError small text-danger" id="genderError"></span>
          </div>
        </div>
        <!-- Academic Details: -->
        <div class="p-4 mt-4 mb-5 rounded-3 shadow d-flex flex-column gap-3">
          <div>
            <label class="fw-bolder mb-2" for="lastCompletedQualification"
              >Qualification Required:</label
            >
            <select
              name=""
              id="lastCompletedQualification"
              class="form-control"
            >
              <option value="">12th</option>
              <option value="10th">10th</option>
              <option value="12th">12th</option>
              <option value="Graduate">Graduate</option>
              <option value="Postgraduate">Postgraduate</option>
            </select>
            <span
              class="manualError small text-danger"
              id="lastCompletedQualificationError"
            ></span>
          </div>
          <div>
            <label for="percentage" class="fw-bolder mb-2"
              >Percentage/Grade:</label
            >
            <input
              type="text"
              id="percentage"
              class="form-control"
              placeholder="85"
            />
            <span
              class="manualError small text-danger"
              id="percentageError"
            ></span>
          </div>
        </div>

        <!-- Course Information: -->
        <div class="p-4 mt-4 mb-5 rounded-3 shadow d-flex flex-column gap-3">
          <div>
            <label class="fw-bolder mb-2" for="preferredCourse"
              >Preferred Course:</label
            >
            <select id="preferredCourse" class="form-control">
              <option value="">IIT-JEE</option>
              <option value="IIT-JEE">IIT-JEE</option>
              <option value="NEET">NEET</option>
              <option value="bankingExams">Banking Exams</option>
              <option value="UPSC">UPSC</option>
            </select>
            <span
              class="manualError small text-danger"
              id="preferredCourseError"
            ></span>
          </div>
          <div>
            <label class="fw-bolder mb-2" for="batchTimingPreference"
              >Batch Timing Preference:</label
            >
            <div class="d-flex gap-2">
              <input
                type="checkbox"
                name="batchTiming"
                value="Morning"
              />Morning
              <input
                type="checkbox"
                name="batchTiming"
                value="Afternoon"
              />Afternoon
              <input
                type="checkbox"
                name="batchTiming"
                value="Evening"
              />Evening
              <input
                type="checkbox"
                name="batchTiming"
                value="Weekend"
              />Weekend
            </div>
            <span
              class="manualError small text-danger"
              id="batchTimingPreferenceError"
            ></span>
          </div>
        </div>
        <!-- Address -->

        <div class="p-4 mt-4 mb-5 rounded-3 shadow d-flex flex-column gap-3">
          <div>
            <label for="residentialAddress" class="fw-bolder mb-2"
              >Residential Address:</label
            >
            <input
              type="text"
              id="residentialAddress"
              class="form-control"
              placeholder="123, Main Street, Delhi"
            />
            <span
              class="manualError small text-danger"
              id="residentialAddressError"
            ></span>
          </div>
          <div>
            <label for="city" class="fw-bolder mb-2">City:</label>
            <input
              type="text"
              id="city"
              class="form-control"
              placeholder="Delhi"
            />
             <span
              class="manualError small text-danger"
              id="cityError"
            ></span>
          </div>
          <div>
            <label for="pinCode" class="fw-bolder mb-2">Pin Code:</label>
            <input
              type="number"
              id="pinCode"
              class="form-control"
              placeholder="110011"
            />
             <span
              class="manualError small text-danger"
              id="pinCodeError"
            ></span>
          </div>
        </div>
        <!-- Guardian Details: -->
        <div class="p-4 mt-4 mb-5 rounded-3 shadow d-flex flex-column gap-3">
          <div>
            <label for="guardiansFullName" class="fw-bolder mb-2"
              >Guardian’s Full Name:</label
            >
            <input
              type="text"
              id="guardiansFullName"
              class="form-control"
              placeholder="Suresh Vardhan"
            />
             <span
              class="manualError small text-danger"
              id="guardiansFullNameError"
            ></span>
          </div>
          <div>
            <label for="guardianContactNumber" class="fw-bolder mb-2"
              >Guardian’s Contact Number:</label
            >
            <input
              type="number"
              id="guardianContactNumber"
              class="form-control"
              placeholder="9876543211"
            />
             <span
              class="manualError small text-danger"
              id="guardianContactNumberError"
            ></span>
          </div>
        </div>
        <!-- Additional Information: -->
        <div class="p-4 mt-4 mb-4 rounded-3 shadow d-flex flex-column gap-3">
          <div>
            <label class="fw-bolder mb-2" for=" howdidYouHearAboutUs"
              >How did you hear about us?:</label
            >
            <select id="howdidYouHearAboutUs" class="form-control">
              <option value="">Friends</option>
              <option value="Friends">Friends</option>
              <option value="onlineAd">Online Ad</option>
              <option value="Newspaper">Newspaper</option>
              <option value="socialMedia">Social Media</option>
              <option value="Other">Other</option>
            </select>
             <span
              class="manualError small text-danger"
              id="howdidYouHearAboutUsError"
            ></span>
          </div>
          <div>
            <label class="fw-bolder mb-2" for="specialRequirements">
              Special Requirements
              <span class="fw-medium">(optional)</span>:</label
            >
            <textarea
              name=""
              id="specialRequirements"
              rows="5"
              class="form-control"
            ></textarea>
          </div>
        </div>
        <div class="d-flex justify-content-between mb-4">
          <button type="reset" class="btn btn-dark px-4">Reset</button>
          <button type="submit" class="btn btn-primary px-4">Submit</button>
        </div>
      </div>
    </form>

    <!-- bootstrap links -->
    <script src="script.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
