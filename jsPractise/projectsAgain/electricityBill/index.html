<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
      <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
</head>
<body class="bg-success">

<form>
    <div class=" d-flex justify-content-center">
        <div class="border w-50 shadow bg-light p-5 rounded mt-5">
            <h1 class="text-center">Electricity Bill Calculator</h1>
            <p class="text-center opacity-75">Calculate your electricity bill as fast as speed of light</p>
            <div class="flex flex-column gap-3">
                <div>
                    <label for="electricityBill" class="fw-bolder mb-3">Electricity Bill</label>
                    <input type="text" id="electricityBill" class="form-control">
                </div>
                <button class="btn btn-primary w-100 mb-3 mt-3" id="Calculate">Calculate</button>
                <button type="reset" class="btn btn-danger w-100" id="reset">Reset</button>

                <div>
                    <p class="mt-4 text-center">The amount to be Paid : <span id="realAmount">10</span></p>
                </div>
            </div>
        </div>
    </div>
</form>

      <!-- bootstrap link -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
</body>
</html>
