<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <header>
      <h1 class="text-white bg-primary text-center p-3">To Do List</h1>
    </header>
    <div class="container p-3 shadow w-100 border rounded mt-4">
      <div class="d-flex align-items-center gap-3">
        <input
          type="text"
          placeholder="Enter the task..."
          id="taskinput"
          class="form-control w-75"
        />
        <button onclick="addnewTask()"
          class="btn btn-primary w-25 d-flex justify-content-center align-items-center gap-2"
        >
          <i class="bi bi-plus fs-5"></i>Add new Task
        </button>
      </div>
    </div>

    <div class="container mt-3 shadow rounded p-3 d-none">
      <ol id="taskList">
        <!-- <li class="my-3">
          <div  class="d-flex justify-content-start align-items-center gap-5">
            <span>Task 1</span>
            <button class="btn btn-danger px-4 d-flex gap-2 mb-0">
              <i class="bi bi-trash-fill"></i>Delete
            </button>
          </div>
        </li> -->
      </ol>
    </div>

    <!-- bootstrap link -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="todolist.js"></script>
  </body>
</html>
