<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body style="background-image: url(https://www.baltana.com/files/wallpapers-1/Sunset-Wallpaper-HD-02544.jpg); background-repeat: no-repeat ; background-size: cover; background-position: center;height: 100vh;" class="text-white">
    <header>
      <h1 class="text-center text-white bg-primary p-2 rounded-bottom">
        Weather App
      </h1>
    </header>
    <div class="container p-5">
      <div class="row d-flex justify-content-center">
        <div class="col-12 col-md-8 col-lg-4">
          <div class="border border-3 rounded p-3">
            <!-- search box -->
            <div class="searchbox d-flex gap-3 mb-5">
              <input
                type="text"
                class="form-control"
                placeholder="Enter City..."
                id="city"
              />
              <button class="btn btn-primary">
                <i class="bi bi-search"></i>
              </button>
            </div>
            <!-- output box -->
            <div class="d-flex flex-column">
              <div class="d-flex justify-content-center">
                <div class="d-flex flex-column align-items-center">
                  <i class="bi bi-thermometer-sun fs-1"></i>
                  <h1 id="temperature">20°C</h1>
                  <h3 id="cityname" class="fw-bold">New York</h3>
                </div>
              </div>
              <div class=" d-flex gap-5 justify-content-center p-4 mt-3">
                <div class=" p-3">
                  <div class="d-flex flex-column align-items-center">
                    <i class="bi bi-moisture fs-1"></i>
                    <h4 id="humidityValue">50%</h4>
                    <p class="fw-bolder">Humidity</p>
                  </div>
                </div>
                <div class=" p-3">
                  <div class="d-flex flex-column align-items-center">
                    <i class="bi bi-speedometer fs-1"></i>
                    <h4 id="windSpeedValue">15Km/h</h4>
                    <p class="fw-bolder">WindSpeed</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- bootstrap links -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
